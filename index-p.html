:root{
  --night:#1A0E22;
  --night-2:#2B1348;
  --dusk:#5C1F53;
  --brick:#C9502C;
  --brick-d:#8A3A1E;
  --gold:#FFC53D;
  --gold-d:#B3541F;
  --cream:#FFF3DC;
  --warm:#FF8A3D;

  --font-cn:"PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-led:"Orbitron","SF Mono",Menlo,ui-monospace,monospace;

  --pad:clamp(16px,5vw,34px);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--night)}
body{
  position:fixed;inset:0;
  overflow:hidden;
  background:var(--night);
  color:var(--cream);
  font-family:var(--font-cn);
  -webkit-font-smoothing:none;
  overscroll-behavior:none;
}

/* ---------- 暮色天空 ---------- */
.sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,
    #140A1E 0%, #1A0E22 30%, #3A1550 58%, #5C1F53 78%, #8A3A2E 94%, #C9502C 100%);
}

/* 像素落日：平涂 + 硬投影 */
.sun{
  position:fixed;z-index:1;pointer-events:none;
  left:50%;bottom:24vh;
  width:clamp(150px,44vw,230px);height:clamp(150px,44vw,230px);
  transform:translateX(-50%);
  border-radius:50%;
  background:linear-gradient(180deg,#FFE082 0%,#FFB84D 46%,#FF8A3D 78%,#E8542F 100%);
  box-shadow:
    10px 10px 0 rgba(20,10,30,.32),
    0 0 70px rgba(255,138,61,.30),
    inset -14px -10px 0 rgba(232,84,47,.35);
}
/* 落日下缘的像素横切 */
.sun::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:42%;
  background:repeating-linear-gradient(180deg,
    transparent 0 12px,
    var(--dusk) 12px 22px,
    transparent 22px 24px,
    var(--dusk) 24px 38px,
    transparent 38px 40px);
  border-radius:0 0 999px 999px;
}

/* 像素星（box-shadow 点阵） */
.stars{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  animation:twinkle 3.4s steps(2) infinite;
}
.stars i{
  position:absolute;width:2px;height:2px;background:var(--cream);
  box-shadow:
    12vw 8vh 0 #FFE9C4, 28vw 4vh 0 rgba(255,233,196,.7),
    46vw 12vh 0 #FFE9C4, 63vw 6vh 0 rgba(255,233,196,.55),
    78vw 10vh 0 #FFE9C4, 89vw 5vh 0 rgba(255,233,196,.6),
    20vw 20vh 0 rgba(255,233,196,.5), 55vw 18vh 0 #FFE9C4,
    72vw 24vh 0 rgba(255,233,196,.45), 8vw 26vh 0 rgba(255,233,196,.55);
}
@keyframes twinkle{50%{opacity:.45}}

/* 暖色透视地网 */
.floor{
  position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:2;
  pointer-events:none;perspective:760px;perspective-origin:50% 0%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.5) 44%,transparent 74%);
  mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.5) 44%,transparent 74%);
}
.floor__grid{
  position:absolute;left:-70%;right:-70%;top:0;bottom:0;
  transform-origin:50% 100%;transform:rotateX(68deg);opacity:.5;
  background-image:
    linear-gradient(rgba(255,138,61,.55) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,138,61,.4) 2px, transparent 2px);
  background-size:96px 96px;
  animation:floorRun 8s steps(24) infinite;
}
@keyframes floorRun{
  from{background-position:0 0,0 0}
  to{background-position:0 96px,0 0}
}

/* CRT 扫描线 + 暗角 */
.scan{
  position:fixed;inset:0;z-index:8;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px);
}
.vig{
  position:fixed;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(120% 84% at 50% 42%,transparent 52%,rgba(20,10,30,.72) 100%);
}

/* ---------- 布局 ---------- */
.stage{
  position:fixed;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 18px);
  text-align:center;
}

/* 顶部角标 */
.corners{
  position:fixed;z-index:9;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  left:var(--pad);right:var(--pad);
  display:flex;align-items:center;gap:10px;
}
.corners img{
  height:26px;width:auto;
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 0 rgba(20,10,30,.5));
}
.corners img:last-of-type{margin-left:-2px}
.corners b{
  margin-left:auto;
  font-family:var(--font-led);font-weight:700;
  font-size:10px;letter-spacing:.22em;
  color:rgba(255,233,196,.6);
  text-shadow:2px 2px 0 rgba(20,10,30,.6);
}

/* ---------- 眉标 ---------- */
.kicker{
  margin:0 0 clamp(16px,3.6vh,26px);
  font-family:var(--font-led);
  font-size:clamp(12px,3.4vw,15px);
  font-weight:600;
  line-height:1.9;
  letter-spacing:.12em;
  color:var(--gold);
  text-shadow:2px 2px 0 rgba(20,10,30,.75);
}
.kicker span{display:block;white-space:nowrap}
.kicker em{
  font-style:normal;color:var(--warm);
}

/* ---------- 字标：8-bit 挤出 ---------- */
.title{
  position:relative;
  margin:0;
  font-family:var(--font-cn);
  font-size:clamp(52px,17.5vw,108px);
  font-weight:800;
  line-height:1.06;
  letter-spacing:.04em;
  color:var(--cream);
  text-shadow:
    3px 3px 0 var(--brick),
    6px 6px 0 var(--brick-d),
    9px 9px 0 rgba(20,10,30,.45);
}
.title__en{
  margin:clamp(16px,3vh,24px) 0 0;
  font-family:var(--font-led);font-weight:900;
  font-size:clamp(13px,3.8vw,20px);
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--gold);
  text-shadow:2px 2px 0 rgba(20,10,30,.75),0 0 24px rgba(255,197,61,.28);
}

/* ---------- 浮动金问号砖 ---------- */
.brick-float{
  position:relative;
  margin-top:clamp(26px,5.2vh,40px);
  width:54px;height:54px;
  image-rendering:pixelated;
  background:
    linear-gradient(180deg,transparent 0 6px,rgba(255,255,255,.28) 6px 8px,transparent 8px),
    linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px),
    repeating-linear-gradient(180deg,transparent 0 16px,rgba(90,45,10,.5) 16px 18px),
    linear-gradient(180deg,#FFD75E,#FFC53D 60%,#E8971E);
  border:3px solid var(--gold-d);
  box-shadow:
    inset -3px -3px 0 rgba(90,45,10,.55),
    5px 5px 0 rgba(20,10,30,.4),
    0 0 26px rgba(255,197,61,.35);
  animation:bob 2.6s steps(6) infinite;
}
.brick-float::after{
  content:"?";
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-led);font-weight:900;
  font-size:26px;color:#7A3A0E;
  text-shadow:2px 2px 0 rgba(255,233,196,.5);
}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* ---------- PLAY 键 ---------- */
.play{
  margin-top:clamp(26px,4.6vh,40px);
  display:inline-flex;align-items:center;gap:12px;
  padding:0 34px;height:58px;
  text-decoration:none;
  background:var(--gold);
  color:#241026;
  font-family:var(--font-cn);
  font-size:16px;font-weight:800;letter-spacing:.3em;text-indent:.3em;
  border:3px solid var(--gold-d);
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
  box-shadow:0 7px 0 var(--gold-d),0 7px 0 3px rgba(20,10,30,.4),0 0 34px rgba(255,197,61,.3);
  transition:transform .08s steps(2),box-shadow .08s steps(2);
  -webkit-tap-highlight-color:transparent;
}
.play b{
  font-family:var(--font-led);font-size:9px;font-weight:700;
  letter-spacing:.2em;opacity:.55;
}
.play:active{
  transform:translateY(7px);
  box-shadow:0 0 0 var(--gold-d),0 0 0 0 rgba(20,10,30,.4);
}

/* ---------- 底部信息 ---------- */
.foot{
  position:fixed;z-index:9;
  left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:var(--font-led);
  font-size:9px;letter-spacing:.22em;
  color:rgba(255,233,196,.55);
  text-shadow:2px 2px 0 rgba(20,10,30,.6);
}
.foot s{
  text-decoration:none;color:rgba(255,197,61,.75);
}
.foot i{font-style:normal;color:rgba(255,138,61,.6)}

/* 矮屏压缩 */
@media (max-height:660px){
  .title{font-size:clamp(44px,14vw,72px)}
  .brick-float{width:44px;height:44px;margin-top:18px}
  .brick-float::after{font-size:21px}
  .play{height:50px;margin-top:20px}
  .sun{bottom:20vh}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
