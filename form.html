:root{
  --ink:#04030A;
  --violet:#3B227B;
  --violet-l:#6B4EC4;
  --gold:#C79B6E;
  --gold-l:#F0D6B6;
  --gold-hi:#FFD9A8;
  --ice:#9FD3EC;
  --paper:#F2ECE6;
  --neon:#FF6FB5;
  --neon-hot:#FF2E9A;

  --font-cn:"PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-led:"Orbitron","SF Mono",Menlo,ui-monospace,monospace;

  --pad:clamp(18px,5.4vw,30px);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{
  min-height:100dvh;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--font-cn);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior:none;
}

/* ---------- 背景 ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg__grad{
  position:absolute;inset:0;
  background:
    radial-gradient(64% 42% at 50% 8%, rgba(59,34,123,.46) 0%, rgba(59,34,123,0) 68%),
    radial-gradient(46% 30% at 78% 78%, rgba(255,46,154,.13) 0%, rgba(255,46,154,0) 72%),
    radial-gradient(52% 34% at 16% 62%, rgba(159,211,236,.10) 0%, rgba(159,211,236,0) 74%),
    linear-gradient(180deg, #06040D 0%, #04030A 46%, #07050F 100%);
}
/* 透视地网 */
.floor{
  position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:0;
  pointer-events:none;perspective:760px;perspective-origin:50% 0%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.5) 44%,transparent 74%);
  mask-image:linear-gradient(to top,#000 0%,#000 14%,rgba(0,0,0,.5) 44%,transparent 74%);
}
.floor__grid{
  position:absolute;left:-70%;right:-70%;top:0;bottom:0;
  transform-origin:50% 100%;transform:rotateX(68deg);opacity:.58;
  background-image:
    linear-gradient(rgba(159,211,236,.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(159,211,236,.34) 1px, transparent 1px);
  background-size:88px 88px;
  animation:floorRun 11s linear infinite;
}
@keyframes floorRun{
  from{background-position:0 0,0 0}
  to{background-position:0 88px,0 0}
}
.horizon{
  position:fixed;left:0;right:0;bottom:calc(34vh - 8px);height:1px;z-index:1;
  pointer-events:none;opacity:.4;
  background:linear-gradient(90deg,transparent,rgba(159,211,236,.34) 18%,rgba(159,211,236,.62) 50%,rgba(159,211,236,.34) 82%,transparent);
  box-shadow:0 0 22px 1px rgba(159,211,236,.18),0 0 58px 8px rgba(107,78,196,.12);
}
#dust{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.7}
/* CRT 扫描线 */
.scan{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0px,rgba(255,255,255,.028) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:overlay;
}
.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 44%,transparent 46%,rgba(4,3,10,.72) 100%);
}

/* ---------- 布局 ---------- */
.wrap{
  position:relative;z-index:5;
  min-height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 22px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 26px);
  max-width:520px;margin:0 auto;
}

/* 顶栏 */
.brand{
  display:flex;align-items:center;gap:9px;
  font-family:var(--font-led);font-weight:700;
  font-size:10px;letter-spacing:.3em;
  color:rgba(240,214,182,.62);
}
.brand i{
  font-style:normal;font-size:15px;line-height:1;
  color:var(--gold-hi);
  text-shadow:0 0 12px rgba(255,217,168,.7),0 0 26px rgba(255,46,154,.35);
}
.brand em{
  margin-left:auto;font-style:normal;
  font-size:8px;letter-spacing:.26em;
  color:rgba(242,236,230,.28);
}

/* 标题区 */
.main{
  flex:1;
  display:flex;flex-direction:column;justify-content:center;
  padding-top:clamp(14px,3.4vh,30px);
}
.head{margin-top:clamp(20px,5.4vh,42px)}
.head__k{
  margin:0 0 10px;
  font-family:var(--font-led);font-weight:500;
  font-size:8px;letter-spacing:.42em;
  color:rgba(159,211,236,.68);
}
.head__t{
  margin:0;
  font-size:clamp(24px,7.2vw,31px);
  font-weight:700;letter-spacing:.02em;line-height:1.22;
  background:linear-gradient(178deg,#FFF5E6 6%,var(--gold-l) 34%,var(--gold) 62%,#8C6742 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 22px rgba(199,155,110,.24));
}
.head__s{
  margin:11px 0 0;
  font-size:12.5px;line-height:1.72;
  color:rgba(242,236,230,.5);
  letter-spacing:.015em;
}

/* ---------- 代号输入 ---------- */
.field{margin-top:clamp(24px,5vh,36px)}

}
.field__box.on .field__line{transform:scaleX(1);opacity:1}
.field.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-1.5px)}

}

/* ---------- 原型选择 ---------- */
.roles{margin-top:clamp(22px,4.4vh,32px)}
.roles__lb{
  display:flex;align-items:baseline;gap:8px;

}
.role{

  text-align:left;
  border:1px solid rgba(199,155,110,.20);

}
.role::before{
  content:"";position:absolute;top:0;right:0;

.role.on{
  border-color:rgba(255,217,168,.72);

.role.on .role__cn{color:#FFF3E2}
.role.on .role__en{color:rgba(255,217,168,.8)}

/* ---------- 主按钮 ---------- */
.cta{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:56px;margin-top:clamp(24px,4.4vh,34px);

  border:0;
  clip-path:polygon(13px 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%,0 13px);
  background:linear-gradient(96deg,var(--gold-l) 0%,var(--gold) 44%,#9C7347 100%);
  color:#1A1024;
  font-family:var(--font-cn);
  font-size:14.5px;font-weight:700;letter-spacing:.16em;

@keyframes ctaSheen{

}

.card{
  position:relative;
  width:min(346px,86vw);
  padding:22px 22px 20px;
  border:1px solid rgba(199,155,110,.42);
  border-radius:3px;
  background:
    radial-gradient(120% 90% at 50% -20%,rgba(59,34,123,.62) 0%,rgba(59,34,123,0) 62%),
    linear-gradient(168deg,#0C0918 0%,#05040C 58%,#0A0714 100%);
  box-shadow:0 0 0 1px rgba(255,217,168,.06) inset,0 26px 70px -22px rgba(0,0,0,.9),0 0 60px -18px rgba(255,111,181,.32);
  transform:translateY(16px) scale(.94) rotateX(9deg);
  opacity:0;
  transition:transform .62s cubic-bezier(.22,1,.36,1),opacity .48s ease;

}

/* 卡面扫光 */
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,transparent 34%,rgba(255,217,168,.13) 50%,transparent 64%);

.pass.on .card::before{animation:cardSheen 2.4s cubic-bezier(.3,0,.2,1) .35s}

}
/* 四角刻度 */
.card__corner{position:absolute;width:13px;height:13px;border-color:rgba(255,217,168,.5);border-style:solid;border-width:0}

}

}

}

.pass__go{
  width:min(346px,86vw);height:52px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid rgba(199,155,110,.5);
  border-radius:2px;
  background:rgba(199,155,110,.09);
  color:rgba(255,243,226,.94);
  font-family:var(--font-cn);font-size:13.5px;font-weight:600;letter-spacing:.18em;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s .34s,transform .5s .34s,background .2s,border-color .2s;
}
.pass.on .pass__go{opacity:1;transform:translateY(0)}
.pass__go:active{background:rgba(199,155,110,.18)}

.pass__hint{

  font-family:var(--font-led);font-size:7px;letter-spacing:.26em;

  opacity:0;transition:opacity .5s .5s;
}

.pass__back{
  margin-top:-6px;
  padding:6px 10px;
  border:0;background:transparent;
  color:rgba(242,236,230,.34);
  font-family:var(--font-cn);font-size:11px;letter-spacing:.1em;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  opacity:0;transition:opacity .5s .46s,color .2s;
}
.pass.on .pass__back{opacity:1}
.pass__back:active{color:rgba(242,236,230,.6)}

/* 小屏压缩 */
@media (max-height:700px){
  .head{margin-top:16px}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .cta::after{display:none}
}

<body>

<div class="bg"><div class="bg__grad"></div></div>
<div class="floor"><div class="floor__grid"></div></div>
<div class="horizon"></div>
<canvas id="dust"></canvas>
<div class="scan"></div>
<div class="vig"></div>

<main class="wrap" id="wrap">

  <div class="brand"><i>∞</i>INFINITE GAME<em>PLAYER ACCESS</em></div>

  <div class="main">

  <div class="head">
    <p class="head__k">CREATE YOUR IDENTITY</p>
    <h1 class="head__t">先成为一个人物，<br>再走进这场游戏。</h1>
    <p class="head__s">这是一个代号，不是一张表。你写的字只留在<b>这台手机</b>里，没有人会拿它去核对你是谁。</p>
  </div>

  <div class="field" id="field">
    <label class="field__lb" for="nick">
      你的代号
      <span class="field__num"><i id="cnt">0</i>/12</span>
    </label>
    <div class="field__box" id="box">
      <input id="nick" type="text" maxlength="12" autocomplete="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="done" placeholder="晚风 / 小林老师 / NightOwl">
      <div class="field__line"></div>
    </div>
  </div>

  <div class="roles">
    <div class="roles__lb">你想以什么方式参与<span>可选</span></div>
    <div class="roles__grid" id="roles"></div>
  </div>

  <button class="cta" id="go"><span>领取通行证</span><b>INITIALIZE</b></button>

  <p class="note">
    <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V6z"/><path d="M9.2 12l2 2 3.6-3.8"/></svg>
    <span>为保障个人信息安全，可使用虚拟信息。<br>本页不联网、不提交、不留存，关闭即清空。</span>
  </p>

  </div>

</main>

<!-- 通行证 -->
<div class="pass" id="pass" role="dialog" aria-modal="true" aria-label="你的入场通行证">
  <div class="card" id="card">
    <span class="card__corner tl"></span><span class="card__corner tr"></span>
    <span class="card__corner bl"></span><span class="card__corner br"></span>
    <div class="card__top"><i>∞</i>INFINITE GAME<em>PLAYER PASS</em></div>
    <p class="card__lb">CODENAME</p>
    <h2 class="card__name" id="cName">—</h2>
    <div class="card__role">
      <svg id="cIcon" viewBox="0 0 24 24"></svg>
      <b id="cRole">探索者</b>
      <span id="cRoleEn">EXPLORER</span>
    </div>
    <div class="card__line"></div>
    <div class="card__foot">
      <div class="card__no"><i>PASS NO.</i><u id="cNo">QP-2605-0000</u></div>
      <div class="card__dt"><i>DATE</i><u class="sm">2026.12.05</u></div>
    </div>
  </div>
  <button class="pass__go" id="enter"><span>进入会场</span><b>ENTER</b></button>
  <button class="pass__back" id="back">改一下代号</button>

</div>

<script>
(function(){
'use strict';

/* ============ 玩家原型 ============ */
const ROLES = [
  { id:'explorer', cn:'探索者', en:'EXPLORER', d:'总要先把每个角落走一遍',
    p:'M12 3v18M3 12h18M12 6.2l1.9 3.9 3.9 1.9-3.9 1.9L12 17.8l-1.9-3.9L6.2 12l3.9-1.9z' },
  { id:'builder', cn:'建造者', en:'BUILDER', d:'把想法做成别人能用的东西',
    p:'M12 3.4L21 19H3zM12 9.6l4.2 7.4H7.8z' },
  { id:'mender', cn:'修补者', en:'MENDER', d:'让快要坏掉的东西重新转起来',
    p:'M20 12a8 8 0 1 1-2.6-5.9M20 4.2V10h-5.8' },
  { id:'teller', cn:'讲述者', en:'STORYTELLER', d:'让发生过的事被人记住',
    p:'M4 6.5h11.5M4 11.5h16M4 16.5h9M18 15.2c1.6 0 2.9 1.2 2.9 2.7S19.6 20.6 18 20.6' }
];

const $ = s => document.querySelector(s);
const nick = $('#nick'), cnt = $('#cnt'), box = $('#box'),
      field = $('#field'), rolesEl = $('#roles'), goBtn = $('#go'),
      pass = $('#pass'), card = $('#card');

let picked = null;

/* ============ 渲染原型 ============ */
ROLES.forEach(r => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'role';
  b.dataset.id = r.id;
  b.setAttribute('aria-pressed','false');
  b.innerHTML =
    '<span class="role__top">' +
      '<svg viewBox="0 0 24 24"><path d="' + r.p + '"/></svg>' +
      '<span class="role__cn">' + r.cn + '</span>' +
    '</span>' +
    '<span class="role__en">' + r.en + '</span>' +
    '<span class="role__d">' + r.d + '</span>';
  b.addEventListener('click', () => {
    picked = (picked === r.id) ? null : r.id;
    [...rolesEl.children].forEach(el => {
      const on = el.dataset.id === picked;
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  });
  rolesEl.appendChild(b);
});

/* ============ 输入 ============ */
nick.addEventListener('focus', () => box.classList.add('on'));
nick.addEventListener('blur',  () => box.classList.remove('on'));
nick.addEventListener('input', () => {
  cnt.textContent = nick.value.trim().length;
  field.classList.remove('shake');
});

/* ============ 领取通行证 ============ */
function makeNo(){
  // 仅作仪式编号，不含任何真实序号
  const n = Math.floor(Math.random() * 9000) + 1000;
  return 'QP-2605-' + n;
}

function openPass(){
  const name = nick.value.trim();
  if (!name){
    field.classList.remove('shake');
    void field.offsetWidth;
    field.classList.add('shake');
    box.classList.add('on');
    nick.focus();
    return;
  }

  const role = ROLES.find(r => r.id === picked) || ROLES[0];

  $('#cName').textContent = name;
  $('#cRole').textContent = role.cn;
  $('#cRoleEn').textContent = role.en;
  $('#cIcon').innerHTML = '<path d="' + role.p + '"/>';
  $('#cNo').textContent = makeNo();

  // 仅存本机，供日程页打招呼；不联网
  try{
    localStorage.setItem('ig.player', JSON.stringify({
      name: name, role: role.cn, roleEn: role.en, at: Date.now()
    }));
  }catch(e){}

  pass.classList.add('on');
  document.body.style.overflow = 'hidden';
}

goBtn.addEventListener('click', openPass);
nick.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); nick.blur(); openPass(); }
});

/* ============ 进入会场 ============ */
$('#enter').addEventListener('click', () => {
  location.href = 'story.html';
});

/* 回退：改代号 */
function closePass(){
  pass.classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(() => nick.focus(), 220);
}
$('#back').addEventListener('click', closePass);
addEventListener('keydown', e => {
  if (e.key === 'Escape' && pass.classList.contains('on')) closePass();
});

/* ============ 尘埃粒子 ============ */
(function dust(){
  const cv = $('#dust');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!cv || reduce) return;
  const ctx = cv.getContext('2d');
  let w = 0, h = 0, dpr = 1, pts = [];

  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(34, Math.max(16, w / 13)));
    pts = Array.from({length: n}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.3 + 0.4,
      vy: -(Math.random() * 0.16 + 0.05),
      vx: (Math.random() - 0.5) * 0.1,
      a: Math.random() * 0.34 + 0.08,
      pink: Math.random() > 0.62
    }));
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (const p of pts){
      p.y += p.vy; p.x += p.vx;
      if (p.y < -6){ p.y = h + 6; p.x = Math.random() * w; }
      if (p.x < -6) p.x = w + 6;
      if (p.x > w + 6) p.x = -6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.pink
        ? 'rgba(255,111,181,' + p.a + ')'
        : 'rgba(159,211,236,' + p.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  size(); draw();
  let t;
  addEventListener('resize', () => { clearTimeout(t); t = setTimeout(size, 180); });
})();

})();
</script>
